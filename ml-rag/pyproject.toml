[project]
name = "ml-rag"
version = "0.1.0"
description = "RAG over this tutorial repo, with retrieval eval + LLM-as-judge A/B"
requires-python = ">=3.11"
dependencies = ["openai>=1.54", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts", "evaluation"]
